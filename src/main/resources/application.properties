spring.application.name=imobiliaria-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/imobiliaria_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=http://localhost:4200,http://localhost:5500,http://127.0.0.1:5500

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=120
