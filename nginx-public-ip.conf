server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Do not expose authentication, administration or writes over public HTTP.
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }
    location ~* ^/admin { return 403; }
    location = /api/imoveis { proxy_pass http://front-prod; }
    location /api/imoveis/ { proxy_pass http://front-prod; }
    location /api { return 403; }

    location / {
        proxy_set_header Authorization "";
        proxy_pass http://front-prod;
    }
}
