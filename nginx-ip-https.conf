limit_req_zone $binary_remote_addr zone=admin_login:1m rate=5r/m;

server {
    listen 80;
    server_name elianecarneiroimoveis.com.br www.elianecarneiroimoveis.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://elianecarneiroimoveis.com.br$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.elianecarneiroimoveis.com.br;
    ssl_certificate /etc/letsencrypt/live/imobiliaria-dominio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imobiliaria-dominio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://elianecarneiroimoveis.com.br$request_uri;
}

server {
    listen 443 ssl;
    server_name elianecarneiroimoveis.com.br;
    ssl_certificate /etc/letsencrypt/live/imobiliaria-dominio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imobiliaria-dominio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 6m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /api/auth/login {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://front-prod;
    }
    location / { proxy_pass http://front-prod; }
}

