server {
    listen 80;
    server_name 54.94.105.56;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://54.94.105.56$request_uri; }
}

server {
    listen 443 ssl;
    server_name 54.94.105.56;
    ssl_certificate /etc/letsencrypt/live/imobiliaria-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imobiliaria-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Preserve private-only administration until explicitly enabled.
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }
    location ~* ^/admin { return 403; }
    location = /api/imoveis { proxy_pass http://front-prod; }
    location /api/imoveis/ { proxy_pass http://front-prod; }
    location /api { return 403; }
    location / {
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://front-prod;
    }
}
