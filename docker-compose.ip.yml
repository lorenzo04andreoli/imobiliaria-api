# Temporary public read-only catalog; administration stays on the SSH tunnel.
services:
  front-prod:
    ports: !override
      - "127.0.0.1:8081:80"
  public-ip:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
    volumes:
      - ./nginx-public-ip.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front-prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
